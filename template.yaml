AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Enhanced image-processing-stack v3 - Multi-format output (AVIF/WebP/JPG), TIFF support,
  status endpoint, and complete URL tracking

Parameters:
  CdnDistributionId:
    Type: String
    Default: E16GIH1C3GYFQE
    Description: >
      The CloudFront distribution serving images.juniorbay.com / .net. Deleting an object from S3 does
      not stop an edge serving its cached copy, and variants are sent with max-age=31536000 immutable,
      so a delete without an invalidation leaves the image public for up to a year — and only for the
      images someone actually loaded, which are exactly the ones worth taking down.
  SourceBucketName:
    Type: String
    Default: image-processor-source
    Description: Base name; actual bucket will be <base>-<AccountId>-<StackName>
  TargetBucketName:
    Type: String
    Default: images.juniorbay.net
    Description: Existing bucket to write resized images to
  ImageMetadataTableName:
    Type: String
    Default: image_processing_metadata
    Description: Table for single-item photo records
  CdnBase:
    Type: String
    Default: https://images.juniorbay.net
    Description: Base URL used to build public image URLs
  MaxUploadBytes:
    Type: Number
    Default: 104857600
    Description: Max bytes for a photo/other upload. Enforced by S3 itself via the presigned POST's
      content-length-range condition, and reported to clients as maxBytes so they can fail fast.
  MaxVideoUploadBytes:
    Type: Number
    Default: 524288000
    Description: Max bytes for a video upload (mediaType=video). Separate from MaxUploadBytes because
      video is far larger than a photo and will grow again for course content. Raise this at deploy
      time -- no code change, no client release.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 1024
    Tracing: Active

Resources:
  ImageProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${SourceBucketName}-${AWS::AccountId}-${AWS::StackName}'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          # Kept in sync with the live bucket CORS (origins were added out-of-band over time; a redeploy from a
          # stale list would break browser uploads from those origins). sandbox.juniorbay.com = dev dashboard.
          - AllowedOrigins:
              - https://images.juniorbay.net
              - https://images.juniorbay.com
              - https://juniorbay.com
              - https://www.juniorbay.com
              - https://app.juniorbay.com
              - https://api-dev.juniorbay.com
              - https://checkout.juniorbay.com
              - https://test.juniorbay.com
              - https://sandbox.juniorbay.com
              - https://go.jbay.be
              - https://d1aqp2mstwphx2.cloudfront.net
              - https://dashboard.juniorbay.com
              - http://127.0.0.1:5500
              - http://localhost:5500
              - http://127.0.0.1:5173
              - http://localhost:5173
              - http://127.0.0.1:5174
              - http://localhost:5174
            AllowedMethods: [GET, HEAD, PUT, POST]
            AllowedHeaders: ['*']
            ExposedHeaders: ['ETag']
            MaxAge: 86400

  EventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  EventBridgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventBridgeDLQ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventsToDLQ
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3ObjectCreatedToImageQueue.Arn

  EventBridgeToImageQueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToImageQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ImageProcessingQueue.Arn

  S3ObjectCreatedToImageQueue:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.s3]
        detail-type: ["Object Created"]
        detail:
          bucket:
            name:
              - !Ref SourceBucket
      Targets:
        - Id: ToImageQueue
          Arn: !GetAtt ImageProcessingQueue.Arn
          RoleArn: !GetAtt EventBridgeToImageQueueRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 185
            MaximumEventAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn

  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ImageMetadataTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK,     AttributeType: S }
        - { AttributeName: SK,     AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
        - { AttributeName: GSI4PK, AttributeType: S }
        - { AttributeName: GSI4SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [ 'id', 'urls', 'color', 'blurHash', 'type' ]
        - IndexName: GSI4
          KeySchema:
            - { AttributeName: GSI4PK, KeyType: HASH }
            - { AttributeName: GSI4SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - imageProcessorApp.js
        External:
          - sharp
    Properties:
      FunctionName: ImageProcessorFunction
      CodeUri: src/
      Handler: imageProcessorApp.handler
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          CDN_BASE: !Ref CdnBase
          PRIMARY_EXT: jpg
          MULTI_FORMATS: avif,webp,jpg
          PRESERVE_SOURCE_FOR: png,pdf,tiff
          MAX_TIFF_DIM: 3000
          WORKER_ID: 1
          API_BASE: ''
          WEB_BASE: ''
          LOG_LEVEL: info
          TARGET_BUCKET_DEFAULT: !Ref TargetBucketName
          PUBLIC_READ_ACL: 'false'
          CACHE_CONTROL: 'public, max-age=31536000, immutable'
          DISABLE_BLURHASH: 'true'
          ALLOW_UPSCALE: "1"
          UPSCALE_MAX: "2"
      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - SQSPollerPolicy:
            QueueName: !GetAtt ImageProcessingQueue.QueueName
        - S3ReadPolicy:
            BucketName: !Ref SourceBucket
        - S3WritePolicy:
            BucketName: !Ref TargetBucketName
        - S3ReadPolicy:
            BucketName: !Ref TargetBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable

  UploadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v3
      CorsConfiguration:
        AllowOrigins:
          - http://127.0.0.1:5500
          - http://localhost:5500
          - https://images.juniorbay.net
          - https://images.juniorbay.com
          - https://juniorbay.com
          - https://www.juniorbay.com
        AllowMethods:
          - OPTIONS
          - GET
          - POST
        AllowHeaders:
          - content-type
          - authorization
          - x-amz-date
          - x-amz-security-token
          - x-amz-content-sha256
        ExposeHeaders:
          - content-disposition
        MaxAge: 86400
        AllowCredentials: false

  CreateUploadFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - createUpload.js
        External:
          - sharp
    Properties:
      CodeUri: src/
      Handler: createUpload.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
          DEFAULT_TARGET_BUCKET: !Ref TargetBucketName
          DEFAULT_BASE_PREFIX: photos
          PART_SIZE: 10485760
          SINGLE_PUT_MAX: 9437184
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SourceBucket
      Events:
        CreateUploadRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload
            Method: POST

  CompleteUploadFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - createUpload.js
        External:
          - sharp
    Properties:
      CodeUri: src/
      Handler: createUpload.complete
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SourceBucket
      Events:
        CompleteRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload/complete
            Method: POST

  UploadBytesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - createUpload.js
        External:
          - sharp
    Properties:
      CodeUri: src/
      Handler: createUpload.bytes
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
          DEFAULT_TARGET_BUCKET: !Ref TargetBucketName
          DEFAULT_BASE_PREFIX: photos
          INLINE_UPLOAD_MAX: 6291456
          CDN_BASE: !Ref CdnBase
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SourceBucket
      Events:
        UploadBytesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload/bytes
            Method: POST

  UploadMultipleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - uploadMultiple.mjs
    Properties:
      CodeUri: src/
      Handler: uploadMultiple.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
          DEFAULT_TARGET_BUCKET: !Ref TargetBucketName
          DEFAULT_BASE_PREFIX: uploads/web
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          MAX_UPLOAD_BYTES_VIDEO: !Ref MaxVideoUploadBytes
          PRESIGN_TTL_SECS: 900
          PHOTOS_TABLE: !Ref PhotosTable            # ✨ added
          CDN_BASE: !Ref CdnBase                    # (optional but useful if you want URLs in pending row)
          MULTI_FORMATS: "avif,webp,jpg"            # (keeps buildExpectedUrls aligned)
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SourceBucket
        - DynamoDBCrudPolicy:                       # ✨ added
            TableName: !Ref PhotosTable
      Events:
        UploadMultipleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload/multiple
            Method: POST


  # NEW: Status endpoint to check processing completion and get URLs
  GetStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - getStatus.js
    Properties:
      CodeUri: src/
      Handler: getStatus.handler
      Timeout: 5
      MemorySize: 256
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          TARGET_BUCKET_DEFAULT: !Ref TargetBucketName
          CDN_BASE: !Ref CdnBase
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
        - S3ReadPolicy:
            BucketName: !Ref TargetBucketName
      Events:
        GetStatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload/status/{id}
            Method: GET

  # NEW: Delete endpoint to remove images and metadata
  DeleteImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - deleteImage.js
    Properties:
      CodeUri: src/
      Handler: deleteImage.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          SOURCE_BUCKET: !Ref SourceBucket
          TARGET_BUCKET_DEFAULT: !Ref TargetBucketName
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
          # The images.juniorbay.com distribution, which is console-managed rather than defined here --
          # hence an id rather than a !Ref. Deleting from S3 does not stop an edge serving a cached
          # copy, and the variants carry max-age=31536000, so without this a takedown is not one.
          CDN_DISTRIBUTION_ID: !Ref CdnDistributionId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
        - S3CrudPolicy:
            BucketName: !Ref SourceBucket
        - S3CrudPolicy:
            BucketName: !Ref TargetBucketName
        # Invalidation only. Not a CloudFront full-access policy: this function needs to purge paths,
        # never to reconfigure or delete the distribution that serves every image on the platform.
        - Statement:
            Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CdnDistributionId}"
      Events:
        DeleteRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /delete/{id}
            Method: DELETE

  # NEW: Reprocess endpoint to regenerate images with custom options
  ReprocessImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - reprocessImage.js
    Properties:
      CodeUri: src/
      Handler: reprocessImage.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          SOURCE_BUCKET: !Ref SourceBucket
          TARGET_BUCKET_DEFAULT: !Ref TargetBucketName
          QUEUE_URL: !Ref ImageProcessingQueue
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
        - S3ReadPolicy:
            BucketName: !Ref SourceBucket
        - S3CrudPolicy:
            BucketName: !Ref SourceBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessingQueue.QueueName
      Events:
        ReprocessRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /reprocess/{id}
            Method: POST

  # NEW: On-demand resize endpoint for custom dimensions
  OnDemandResizeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - onDemandResize.js
        External:
          - sharp
    Properties:
      CodeUri: src/
      Handler: onDemandResize.handler
      Timeout: 30
      MemorySize: 2048
      Environment:
        Variables:
          PHOTOS_TABLE: !Ref PhotosTable
          SOURCE_BUCKET: !Ref SourceBucket
          TARGET_BUCKET_DEFAULT: !Ref TargetBucketName
          CDN_BASE: !Ref CdnBase
          CACHE_CONTROL: 'public, max-age=31536000, immutable'
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
        - S3ReadPolicy:
            BucketName: !Ref SourceBucket
        - S3CrudPolicy:
            BucketName: !Ref TargetBucketName
      Events:
        OnDemandResizeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /resize/{id}/{dimensions}
            Method: GET

  # NEW: Upload from URL endpoint
  UploadFromUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Target: "node20"
        Minify: true
        Bundle: true
        Sourcemap: false
        EntryPoints:
          - uploadFromUrl.js
    Properties:
      CodeUri: src/
      Handler: uploadFromUrl.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
          DEFAULT_TARGET_BUCKET: !Ref TargetBucketName
          DEFAULT_BASE_PREFIX: photos
          QUEUE_URL: !Ref ImageProcessingQueue
          CDN_BASE: !Ref CdnBase
          MAX_FILE_SIZE: 104857600
          MULTI_FORMATS: avif,webp,jpg
          ALLOWED_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500,https://images.juniorbay.net,https://images.juniorbay.com,https://juniorbay.com,https://www.juniorbay.com"
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SourceBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessingQueue.QueueName
      Events:
        UploadFromUrlRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /upload/from-url
            Method: POST

Outputs:
  SourceBucketNameOutput:
    Description: Actual source bucket name created by this stack
    Value: !Ref SourceBucket
  QueueUrlOutput:
    Description: SQS queue URL for image processing
    Value: !Ref ImageProcessingQueue
  LambdaFunctionNameOutput:
    Description: Image processor Lambda function name
    Value: !Ref ImageProcessorFunction
  TargetBucketNameOutput:
    Description: Target bucket receiving resized images
    Value: !Ref TargetBucketName
  UploadApiUrl:
    Description: Base URL for the upload API
    Value: !Sub 'https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com/v3'
  StatusEndpoint:
    Description: Check processing status with GET /upload/status/{id}
    Value: !Sub 'https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com/v3/upload/status/{id}'