version = 0.1

[default.deploy.parameters]
stack_name = "image-processing-stack"
resolve_s3 = true
s3_prefix = "image-processing-stack"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
# The rendition ladder is NOT here. It lives in src/imageProcessorApp.js as the single source of truth.
# It used to be a SizesJson parameter, which failed twice on 2026-09-08: a template Default is ignored once a
# stack has a stored value, and SAM's parameter_overrides cannot carry JSON in either the string or the array
# form (it mangled the value down to `[{`). Keep it in code, guarded by
# stripe-link/tests/test_rendition_ladder.py.
parameter_overrides = [
    "SourceBucketName=image-processor-source",
    "TargetBucketName=images.juniorbay.net",
    "ImageMetadataTableName=image_processing_metadata",
    # EXPLICIT, not left to the template Default. This file already records why: "a template Default is
    # ignored once a stack has a stored value". It is a new parameter today, so the Default would work --
    # and would quietly stop working the first time anyone changed it here.
    "CdnDistributionId=E16GIH1C3GYFQE",
    # EXPLICIT for the reason stated just above, which applies here with teeth: this stack ALREADY has a
    # stored value of 524288000 from when the parameter was created, so raising the template Default on
    # its own changes nothing. 5 GiB is the architectural ceiling (see the parameter's Description) --
    # anything larger mints a presign S3 will refuse.
    "MaxVideoUploadBytes=5368709120",
]
image_repositories = []
